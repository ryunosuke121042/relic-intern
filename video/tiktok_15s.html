* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #0b0b0b; color: #fff; font-family: 'Telop', 'Hiragino Sans', 'Noto Sans JP', sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden; }
#viewport { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0; background: #111; }
.layer { position: absolute; inset: 0; }
#bg { position: absolute; inset: -80px; background-size: cover; background-position: center; filter: blur(36px) brightness(.72) saturate(1.2); }
#box { position: absolute; left: 0; top: 650px; width: 1080px; height: 900px; overflow: hidden; }
#boxInner { position: absolute; inset: 0; transform-origin: 50% 50%; }
#comic { position: absolute; display: block; }
#dim { position: absolute; inset: 0; background: #000; opacity: 0; }
#telop { position: absolute; left: 44px; width: 890px; top: 180px; text-align: center; }
.line { display: block; font-weight: 900; line-height: 1.22; color: #fff; white-space: nowrap;
  -webkit-text-stroke: 22px #1d1d1f; paint-order: stroke fill; transform-origin: 50% 60%; letter-spacing: .02em; }
.r { color: #ffd23f; } .b { color: #59b6ff; } .g { color: #3ee09b; }
#app { position: absolute; inset: 0; opacity: 0; background: radial-gradient(120% 70% at 45% 55%, #1f2a3a 0%, #111 60%); }
#logo { position: absolute; left: 0; width: 980px; top: 520px; display: flex; align-items: center; justify-content: center; gap: 22px; }
#logo img { width: 92px; height: 92px; border-radius: 22px; }
#logo span { font-size: 66px; font-weight: 900; letter-spacing: .04em; }
#phone { position: absolute; left: 70px; top: 650px; width: 840px; padding: 16px; border-radius: 48px; background: #2a2a2e;
  box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 3px #3a3a40 inset; }
#phone img { display: block; width: 808px; border-radius: 34px; }
#controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; width: min(92vw, 520px); }
#controls #bar { flex: 0 0 100%; order: -1; }
#controls #time { margin-left: auto; }
#controls button { font: inherit; font-size: 15px; font-weight: 900; padding: 10px 16px; border-radius: 999px; border: 0; cursor: pointer; background: #3ee09b; color: #111; white-space: nowrap; }
#controls button.sub { background: #2a2a2e; color: #fff; }
#bar { flex: 1; height: 10px; border-radius: 999px; background: #2a2a2e; cursor: pointer; position: relative; }
#fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: #59b6ff; }
#time { font-size: 13px; color: #aaa; font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
#safe { position: absolute; inset: 0; pointer-events: none; display: none; }
#safe div { position: absolute; background: rgba(255,0,0,.18); border: 2px dashed rgba(255,80,80,.8); }
body.showsafe #safe { display: block; }
body.export { display: block; background: #111; }
body.export #controls, body.export #hint { display: none; }
body.export #viewport { border-radius: 0; box-shadow: none; }
#hint { font-size: 12px; color: #777; }
</style>

<script>
const DUR = 15
const IMG_W = 941
// crop = [x, y, w] は元画像の座標（高さは w / 1.2）。[ ] は黄色、{ } は青、< > は緑で強調
const SCENES = [
  { t0: 0.0,  t1: 1.8,  crop: [30, 250, 600],  l1: '[続く人]と{続かない人}', l2: '何が違う？', anim: 'hook' },
  { t0: 1.8,  t1: 3.8,  crop: [15, 0, 912],    l1: '{続かない人}は', l2: 'いきなり{山頂}へ', anim: 'slide' },
  { t0: 3.8,  t1: 5.6,  crop: [250, 230, 624], l1: '遠すぎる…', l2: 'もう無理だ…', anim: 'shake' },
  { t0: 5.6,  t1: 7.4,  crop: [15, 800, 912],  l1: '[続く人]は', l2: 'まず[あの木]まで', anim: 'slide' },
  { t0: 7.4,  t1: 9.2,  crop: [341, 1172, 600], l1: '小さく区切ると', l2: 'いつの間にか[山頂]！', anim: 'bounce' },
  { t0: 9.2,  t1: 10.6, crop: [0, 790, 941],   l1: '継続の正体は', l2: '[小さな困難]の積み重ね', anim: 'message' },
  { t0: 10.6, t1: 12.0, crop: [0, 930, 720], l1: '失敗しても続ければ', l2: '[目標]に届く', anim: 'slide' },
  { t0: 12.0, t1: 13.5, app: true, l1: '何回失敗しても', l2: '<計画アレンジ>で続く！', anim: 'app' },
  { t0: 13.5, t1: 15.0, app: true, l1: 'プロフのリンクから', l2: '<無料>で試してみて！', anim: 'cta' },
]
const $ = (id) => document.getElementById(id)
const stage = $('stage'), comic = $('comic'), boxInner = $('boxInner'), bg = $('bg'), dim = $('dim')
const app = $('app'), phone = $('phone'), logo = $('logo'), l1 = $('l1'), l2 = $('l2'), box = $('box')
bg.style.backgroundImage = `url(${comic.src})`

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v))
const easeOut = (p) => 1 - Math.pow(1 - clamp(p), 3)
const easeBack = (p) => { p = clamp(p); const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2) }

function markup(s) {
  return s.replace(/\[(.+?)\]/g, '<span class="r">$1</span>').replace(/\{(.+?)\}/g, '<span class="b">$1</span>').replace(/<(?!span|\/span)(.+?)>/g, '<span class="g">$1</span>')
}
function plainLen(s) { return s.replace(/[\[\]{}<>]/g, '').length }
function fontSize(s) { return Math.min(130, Math.floor(880 / plainLen(s))) }

let current = -1
function setScene(i) {
  const s = SCENES[i]
  l1.innerHTML = markup(s.l1); l2.innerHTML = markup(s.l2)
  l1.style.fontSize = fontSize(s.l1) + 'px'; l2.style.fontSize = fontSize(s.l2) + 'px'
  app.style.opacity = s.app ? 1 : 0
  box.style.display = bg.style.display = s.app ? 'none' : 'block'
  if (!s.app) {
    const [x, y, w] = s.crop, k = 1080 / w
    comic.style.width = IMG_W * k + 'px'
    comic.style.left = -x * k + 'px'
    comic.style.top = -y * k + 'px'
    bg.style.backgroundPosition = `${((x + w / 2) / IMG_W) * 100}% ${((y + w / 2.4) / 1672) * 100}%`
  }
  current = i
}

function render(t) {
  t = clamp(t, 0, DUR - 0.0001)
  const i = SCENES.findIndex((s) => t >= s.t0 && t < s.t1)
  if (i !== current) setScene(i)
  const s = SCENES[i], u = t - s.t0, len = s.t1 - s.t0
  // テロップ：1行目→2行目の順にポンと出す
  const pop = (el, delay) => {
    const p = clamp((u - delay) / 0.16)
    el.style.opacity = p > 0 ? 1 : 0
    el.style.transform = `scale(${1.35 - 0.35 * easeBack(p)})`
  }
  pop(l1, 0); pop(l2, 0.14)

  let tf = '', kb = 1 + 0.05 * (u / len)
  dim.style.opacity = 0
  switch (s.anim) {
    case 'hook': {
      const sc = 0.55 + 0.45 * easeBack(u / 0.35)
      const hop = u > 0.35 ? -Math.abs(Math.sin((u - 0.35) * 7)) * 34 : 0
      const rot = u > 0.35 ? Math.sin((u - 0.35) * 14) * 2.2 : 0
      tf = `translateY(${hop}px) rotate(${rot}deg) scale(${sc})`
      break
    }
    case 'slide': tf = `translateX(${(1 - easeOut(u / 0.16)) * 140}px)`; break
    case 'shake': {
      const amp = u < 0.7 ? 14 : 4
      tf = `translateX(${Math.sin(u * 42) * amp}px) rotate(${Math.sin(u * 23) * 0.8}deg)`
      dim.style.opacity = 0.15
      break
    }
    case 'bounce': tf = `scale(${1 + 0.1 * Math.exp(-u * 4) * Math.sin(u * 18)})`; break
    case 'message': kb = 1.12 - 0.08 * (u / len); dim.style.opacity = 0.25; break
    case 'app': {
      const p = easeOut(u / 0.28)
      phone.style.transform = `translateY(${(1 - p) * 260}px)`
      phone.style.opacity = p
      logo.style.transform = `scale(${0.6 + 0.4 * easeBack(u / 0.3)})`
      break
    }
    case 'cta': {
      phone.style.transform = 'none'; phone.style.opacity = 1; logo.style.transform = 'none'
      if (u > 0.3) l2.style.transform = `scale(${1 + 0.05 * Math.sin((u - 0.3) * 9)})`
      break
    }
  }
  if (!s.app) boxInner.style.transform = `${tf} scale(${kb})`
}

// ---------- 再生の操作 ----------
const audio = $('audio'), playBtn = $('play'), fill = $('fill'), time = $('time')
let playing = false, t = 0, startT = 0, startPerf = 0
function updateUI() {
  fill.style.width = (t / DUR) * 100 + '%'
  time.textContent = `${t.toFixed(1)} / ${DUR.toFixed(1)}秒`
  playBtn.textContent = playing ? '❚❚ 一時停止' : '▶ 再生'
}
function tick() {
  if (!playing) return
  t = startT + (performance.now() - startPerf) / 1000
  if (t >= DUR) { t = DUR; pause(); render(DUR); updateUI(); return }
  if (!audio.paused && Math.abs(audio.currentTime - t) > 0.15) audio.currentTime = t
  render(t); updateUI()
  requestAnimationFrame(tick)
}
function play() {
  if (t >= DUR - 0.01) t = 0
  playing = true; startT = t; startPerf = performance.now()
  try { audio.currentTime = t; audio.play().catch(() => {}) } catch (e) {}
  updateUI(); requestAnimationFrame(tick)
}
function pause() { playing = false; audio.pause(); updateUI() }
function seek(v) { t = clamp(v, 0, DUR); if (playing) { startT = t; startPerf = performance.now(); audio.currentTime = t } render(t); updateUI() }
playBtn.onclick = () => (playing ? pause() : play())
$('restart').onclick = () => { seek(0); if (!playing) play() }
$('bar').onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); seek(((e.clientX - r.left) / r.width) * DUR) }
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play() }
  if (e.key === 's' || e.key === 'S') document.body.classList.toggle('showsafe')
})

// ---------- 画面に合わせて縮小 ----------
const vp = $('viewport')
function fit() {
  if (document.body.classList.contains('export')) { vp.style.width = '1080px'; vp.style.height = '1920px'; stage.style.transform = 'none'; return }
  const h = Math.min(window.innerHeight - 120, (window.innerWidth - 24) * 16 / 9)
  const k = h / 1920
  vp.style.width = 1080 * k + 'px'; vp.style.height = h + 'px'
  stage.style.transform = `scale(${k})`
}
if (new URLSearchParams(location.search).has('export')) document.body.classList.add('export')
window.addEventListener('resize', fit); fit()
window.renderAt = render
document.fonts.ready.then(() => { render(0); updateUI(); window.ready = true })
</script>
